<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оформить сделку</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #0a0814;
            --card-bg: rgba(22, 16, 42, 0.85);
            --border-color: rgba(139, 92, 246, 0.25);
            --accent-purple: #8b5cf6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: rgba(10, 8, 20, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
        }

        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .field-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            display: block;
        }

        input {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
        }

        .result-box {
            background: var(--input-bg);
            border: 1px solid rgba(74, 222, 128, 0.3);
            padding: 14px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 700;
            color: #4ade80;
            text-align: right;
            margin-bottom: 16px;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
            transition: all 0.2s ease;
        }

        .submit-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>

    <div class="container">
        <div class="card">
            <h3 style="margin-bottom: 18px; font-size: 18px; text-align: center; color: #fff;">💱 Создание заявки</h3>
            
            <label class="field-label">ОТДАЕТЕ (USDT)</label>
            <input type="number" id="usdtInput" placeholder="100" oninput="calculate()">

            <label class="field-label">ПОЛУЧАЕТЕ (РУБЛИ)</label>
            <div class="result-box" id="rubResult">0.00 ₽</div>

            <label class="field-label">ТЕЛЕФОН (СБП)</label>
            <input type="text" id="phoneInput" placeholder="+7 (900) 000-00-00">

            <label class="field-label">ФИО ПОЛУЧАТЕЛЯ</label>
            <input type="text" id="fullNameInput" placeholder="Иванов И. И.">

            <label class="field-label">БАНК</label>
            <input type="text" id="bankInput" placeholder="Сбербанк / Тинькофф">

            <label class="field-label">НОМЕР КАРТЫ (НЕОБЯЗАТЕЛЬНО)</label>
            <input type="text" id="cardInput" placeholder="0000 0000 0000 0000">

            <button type="button" class="submit-btn" onclick="submitOrder()">Создать заявку</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let currentRate = 98.50;
        try {
            const rawData = urlParams.get('data');
            if (rawData) {
                const parsed = JSON.parse(decodeURIComponent(rawData));
                if (parsed.rate) currentRate = parsed.rate;
            }
        } catch(e) {}

        function calculate() {
            const usdt = parseFloat(document.getElementById('usdtInput').value) || 0;
            const rub = (usdt * currentRate).toFixed(2);
            document.getElementById('rubResult').innerText = `${rub} ₽`;
        }

        function submitOrder() {
            const usdt = document.getElementById('usdtInput').value.trim();
            const phone = document.getElementById('phoneInput').value.trim();
            const fullName = document.getElementById('fullNameInput').value.trim();
            const bank = document.getElementById('bankInput').value.trim();
            const card = document.getElementById('cardInput').value.trim() || 'Не указана';

            if (!usdt || usdt === '0' || !phone || !fullName || !bank) {
                tg.showAlert('⚠️ Заполните сумму USDT, Телефон, ФИО и Банк!');
                return;
            }

            const rub = (parseFloat(usdt) * currentRate).toFixed(2);

            const payload = {
                usdt: usdt,
                rub: rub,
                phone: phone,
                fullName: fullName,
                bankName: bank,
                cardNumber: card
            };

            tg.sendData(JSON.stringify(payload));
        }

        // --- КОСМИЧЕСКИЙ МЛЕЧНЫЙ ПУТЬ НА CANVAS ---
const canvas = document.getElementById('stars-canvas');
const ctx = canvas.getContext('2d');
let stars = [];
let nebulae = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initCosmos();
}
window.addEventListener('resize', resizeCanvas);

function initCosmos() {
    stars = [];
    nebulae = [];

    // 1. Создаем обычные звездные точки
    const starCount = Math.floor((canvas.width * canvas.height) / 3000);
    for (let i = 0; i < starCount; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.8,
            alpha: Math.random(),
            speed: Math.random() * 0.015 + 0.005,
            // Разноцветные звезды (белые, голубые, фиолетовые)
            color: ['#ffffff', '#a78bfa', '#c084fc', '#60a5fa'][Math.floor(Math.random() * 4)]
        });
    }

    // 2. Создаем «облака» Млечного пути (густые группы светящихся частиц вдоль диагонали)
    const nebulaCount = 80;
    for (let i = 0; i < nebulaCount; i++) {
        // Концентрируем частицы по диагонали (от верхнего левого к нижнему правому углу)
        const progress = Math.random();
        const offsetX = (Math.random() - 0.5) * (canvas.width * 0.4);
        const offsetY = (Math.random() - 0.5) * (canvas.height * 0.4);

        nebulae.push({
            x: progress * canvas.width + offsetX,
            y: progress * canvas.height + offsetY,
            radius: Math.random() * 80 + 40,
            alpha: Math.random() * 0.15 + 0.05
        });
    }
}

function drawMilkyWay() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // --- СЛОЙ 1: Глубокий галактический градиент (Млечный путь по диагонали) ---
    const milkyGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    milkyGradient.addColorStop(0, 'rgba(15, 10, 30, 1)');
    milkyGradient.addColorStop(0.3, 'rgba(49, 16, 89, 0.45)');   // Насыщенный фиолетовый
    milkyGradient.addColorStop(0.5, 'rgba(88, 28, 135, 0.6)');  // Сердцевина галактики (пурпур)
    milkyGradient.addColorStop(0.7, 'rgba(29, 78, 216, 0.35)');  // Небула (голубоватый)
    milkyGradient.addColorStop(1, 'rgba(10, 8, 20, 1)');

    ctx.fillStyle = milkyGradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // --- СЛОЙ 2: Пылевые туманности Млечного пути ---
    nebulae.forEach(n => {
        const radGrad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.radius);
        radGrad.addColorStop(0, `rgba(167, 139, 250, ${n.alpha})`);
        radGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

        ctx.fillStyle = radGrad;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    // --- СЛОЙ 3: Мерцающие звезды ---
    stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0.1) star.speed = -star.speed;

        ctx.fillStyle = star.color;
        ctx.globalAlpha = Math.abs(star.alpha);
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    requestAnimationFrame(drawMilkyWay);
}

resizeCanvas();
drawMilkyWay();
    </script>
</body>
</html>
