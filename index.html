<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G00D Exchange</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #05040a;
            /* Более прозрачный фон карточек для эффекта стекла */
            --card-glass: rgba(25, 18, 45, 0.55); 
            --border-purple: rgba(167, 139, 250, 0.2);
            --accent-gold: #fcf6ba;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Фон не скроллится */
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 🌌 ФОН: МЛЕЧНЫЙ ПУТЬ НА CANVAS */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* КОНТЕЙНЕР ДЛЯ ПК И МОБИЛОК */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px; /* Ограничиваем ширину на ПК для красоты */
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-sizing: border-box;
        }

        /* 👑 ЗОЛОТОЙ ПЕРЕЛИВАЮЩИЙСЯ ЛОГОТИП */
        .brand-header {
            text-align: center;
            padding: 10px 0 20px 0;
            flex-shrink: 0;
        }

        .gold-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text; /* Кроссбраузерность */
            animation: goldShine 4s linear infinite;
            text-transform: uppercase;
            filter: drop-shadow(0 0 10px rgba(191, 149, 63, 0.6));
        }

        @keyframes goldShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* 👤 ОФОРМЛЕНИЕ ПРОФИЛЯ (GLASSMORPHISM) */
        .profile-card {
            background: var(--card-glass);
            border-radius: 24px;
            padding: 25px;
            border: 1px solid var(--border-purple);
            backdrop-filter: blur(20px); /* Сильное размытие фона */
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.6), inset 0 0 20px 0 rgba(167, 139, 250, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 16px;
        }

        /* Блик внутри карточки */
        .profile-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
        }

        /* АВАТАРКА ПО ЦЕНТРУ С НЕОНОМ */
        .avatar-wrapper {
            position: relative;
            margin-bottom: 16px;
            z-index: 2;
        }

        .avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a78bfa 0%, #6366f1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 800;
            color: #fff;
            border: 4px solid var(--accent-gold); /* Золотая обводка */
            box-shadow: 0 0 30px rgba(167, 139, 250, 0.8), 0 0 15px rgba(252, 246, 186, 0.5);
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ОНЛАЙН СТАТУС */
        .online-status {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            background: #4ade80;
            border-radius: 50%;
            border: 3px solid #19122d;
            box-shadow: 0 0 10px #4ade80;
        }

        .user-name {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
            z-index: 2;
        }

        /* ЗВАНИЕ */
        .user-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: rgba(139, 92, 246, 0.25);
            border: 1px solid #a78bfa;
            color: #c084fc;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
            z-index: 2;
        }

        .user-id {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            z-index: 2;
        }

        /* СТАТИСТИКА ВНУТРИ КАРТОЧКИ */
        .stats-row {
            width: 100%;
            display: flex;
            gap: 12px;
            z-index: 2;
        }

        .stat-item {
            flex: 1;
            background: rgba(10, 8, 20, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 16px;
            transition: transform 0.2s;
        }
        
        .stat-item:active { transform: scale(0.97); }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(252, 246, 186, 0.4);
        }

        /* НИЖНИЕ КНОПКИ (ВНЕ КАРТОЧКИ) */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            flex-shrink: 0;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .btn-glass:active {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(1px);
        }

        /* Кнопка партнерки - более яркая */
        .btn-partner {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid var(--border-purple);
            color: #a78bfa;
        }
        
        .btn-partner:active { background: rgba(139, 92, 246, 0.3); }

    </style>
</head>
<body>

    <!-- 🌌 ФОН: МЛЕЧНЫЙ ПУТЬ -->
    <canvas id="stars-canvas"></canvas>

    <div class="container">
        <!-- Золотой заголовок -->
        <div class="brand-header">
            <div class="gold-title">G00D_EXCH</div>
        </div>

        <!-- 👤 ГЛАВНАЯ КАРТОЧКА ПРОФИЛЯ -->
        <div class="profile-card">
            <div class="avatar-wrapper">
                <div class="avatar" id="userAvatar">U</div>
                <div class="online-status"></div>
            </div>
            
            <div class="user-name" id="userName">Загрузка...</div>
            <div class="user-badge" id="userRankBadge">🌱 Новичок</div>
            <div class="user-id" id="userId">ID: ---</div>

            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-label">Сделок</div>
                    <div class="stat-value" id="totalExchanges">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Оборот</div>
                    <div class="stat-value" id="totalVolume">0 ₽</div>
                </div>
            </div>
        </div>

        <!-- КНОПКИ ДЕЙСТВИЙ (ВНИЗУ) -->
        <div class="action-buttons">
            <button class="btn btn-glass" onclick="openHistory()">
                📜 История
            </button>
            <button class="btn btn-glass" onclick="openTop()">
                🏆 Топ-50
            </button>
            <button class="btn btn-partner" onclick="openReferral()">
                👥 Партнерка
            </button>
            <button class="btn btn-glass" onclick="openSupport()">
                🎧 Поддержка
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // Разворачиваем на ПК на весь экран
        if (tg.requestFullscreen) { tg.requestFullscreen(); } else { tg.expand(); }

        const urlParams = new URLSearchParams(window.location.search);
        let appData = {};
        try {
            const rawData = urlParams.get('data');
            if (rawData) appData = JSON.parse(decodeURIComponent(rawData));
        } catch(e) {}

        // Юзер данные
        const user = tg.initDataUnsafe?.user || {};
        const firstName = user.first_name || 'Трейдер';
        document.getElementById('userName').innerText = firstName + (user.last_name ? ` ${user.last_name}` : '');
        document.getElementById('userId').innerText = `ID: ${user.id || 'Неизвестно'}`;

        // Аватарка
        const avatarEl = document.getElementById('userAvatar');
        if (user.photo_url) {
            avatarEl.innerHTML = `<img src="${user.photo_url}" alt="avatar">`;
        } else {
            avatarEl.innerText = firstName[0].toUpperCase();
        }

        

        function getRankInfo(volume) {
            if (volume < 10000) return { name: "Новичок I", icon: "🥉" };
            else if (volume < 20000) return { name: "Новичок II", icon: "🥉" };
            else if (volume < 30000) return { name: "Новичок III", icon: "🥉" };
            else if (volume < 40000) return { name: "Новичок IV", icon: "🥉" };
            else if (volume < 50000) return { name: "Новичок V", icon: "🥉" };
            else if (volume < 70000) return { name: "Трейдер I", icon: "🥈" };
            else if (volume < 90000) return { name: "Трейдер II", icon: "🥈" };
            else if (volume < 110000) return { name: "Трейдер III", icon: "🥈" };
            else if (volume < 130000) return { name: "Трейдер IV", icon: "🥈" };
            else if (volume < 150000) return { name: "Трейдер V", icon: "🥈" };
            else if (volume < 200000) return { name: "Профи I", icon: "🥇" };
            else if (volume < 250000) return { name: "Профи II", icon: "🥇" };
            else if (volume < 300000) return { name: "Профи III", icon: "🥇" };
            else if (volume < 350000) return { name: "Профи IV", icon: "🥇" };
            else if (volume < 400000) return { name: "Профи V", icon: "🥇" };
            else if (volume < 500000) return { name: "VIP I", icon: "💎" };
            else if (volume < 600000) return { name: "VIP II", icon: "💎" };
            else if (volume < 700000) return { name: "VIP III", icon: "💎" };
            else if (volume < 1000000) return { name: "VIP IV", icon: "💎" };
            else return { name: "VIP MAX", icon: "👑" };
        }

        // Применение звания в профиле
        if (appData.user_stats) {
            const volume = appData.user_stats.volume || 0;
            const rank = getRankInfo(volume);
    
            // Вставляем иконку и название в плашку
            document.getElementById('userRankBadge').innerHTML = `${rank.icon} ${rank.name}`;
        }

        // ФУНКЦИИ КНОПОК (пока просто закрываем WebApp или шлем данные, 
        // для полноценных вкладок нужно дописывать логику)
        function openHistory() { tg.showAlert('📜 История обменов будет доступна в следующем обновлении!'); }
        function openTop() { tg.showAlert('🏆 Топ-50 трейдеров формируется...'); }
        
        function openReferral() { 
            // Можно отправить данные боту, чтобы он прислал реф. ссылку в чат
            tg.sendData(JSON.stringify({action: 'get_ref_link'}));
        }

        function openSupport() {
            tg.openTelegramLink('https://t.me/твой_саппорт_юзернейм'); // 👈 ЗАМЕНИ НА РЕАЛЬНЫЙ ЮЗЕРНЕЙМ
        }

        // --- CANVAS МЛЕЧНЫЙ ПУТЬ ---
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let nebulae = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initCosmos();
        }
        window.addEventListener('resize', resizeCanvas);

        function initCosmos() {
            stars = [];
            nebulae = [];
            
            // Звезды
            const starCount = Math.floor((canvas.width * canvas.height) / 2500);
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.01 + 0.002,
                    color: ['#ffffff', '#a78bfa', '#fcf6ba'][Math.floor(Math.random() * 3)]
                });
            }

            // Туманности (Млечный путь по диагонали)
            for (let i = 0; i < 50; i++) {
                const progress = Math.random();
                const offsetX = (Math.random() - 0.5) * (canvas.width * 0.3);
                const offsetY = (Math.random() - 0.5) * (canvas.height * 0.3);
                nebulae.push({
                    x: progress * canvas.width + offsetX,
                    y: progress * canvas.height + offsetY,
                    radius: Math.random() * 100 + 50,
                    alpha: Math.random() * 0.08 + 0.02
                });
            }
        }

        function drawCosmos() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Фон-градиент
            const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            bgGrad.addColorStop(0, '#05040a');
            bgGrad.addColorStop(0.5, '#100c20');
            bgGrad.addColorStop(1, '#05040a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Туманности
            nebulae.forEach(n => {
                const radGrad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.radius);
                radGrad.addColorStop(0, `rgba(139, 92, 246, ${n.alpha})`);
                radGrad.addColorStop(1, 'rgba(10, 8, 20, 0)');
                ctx.fillStyle = radGrad;
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Звезды
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                ctx.fillStyle = s.color;
                ctx.globalAlpha = Math.abs(s.alpha);
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
            requestAnimationFrame(drawCosmos);
        }
        resizeCanvas();
        drawCosmos();
    </script>
</body>
</html>
