<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Обмен USDT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #141a24;
            --input-bg: #1a2230;
            --accent-color: #5865f2;
            --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --border-color: rgba(255, 255, 255, 0.08);
            --green-rate: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        /* Заголовок в стиле референса */
        .brand-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .brand-title span {
            color: #ef4444;
        }

        /* Карточка курса */
        .rate-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rate-title {
            color: var(--text-muted);
            font-size: 14px;
        }

        .rate-value {
            font-weight: 700;
            color: var(--green-rate);
            font-size: 17px;
        }

        /* Карточки секций */
        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #d1d5db;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .calc-result {
            background-color: var(--input-bg);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            color: #60a5fa;
            text-align: right;
            border: 1px solid var(--border-color);
        }

        /* Кнопка */
        .btn-submit {
            width: 100%;
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
            transition: opacity 0.2s;
        }

        .btn-submit:active {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Панель курса -->
        <div class="rate-card">
            <span class="rate-title">Курс продажи USDT:</span>
            <span class="rate-value" id="currentRate">-- ₽</span>
        </div>

        <!-- Калькулятор -->
        <div class="section-card">
            <div class="section-title">🧮 Калькулятор</div>

            <div class="form-group">
                <label>Отдаёте (USDT)</label>
                <input type="number" id="usdtInput" placeholder="0.00" step="any">
            </div>

            <div class="form-group">
                <label>Получаете (Рубли)</label>
                <div class="calc-result" id="rubResult">0.00 ₽</div>
            </div>
        </div>

        <!-- Реквизиты -->
        <div class="section-card">
            <div class="section-title">📋 Реквизиты получателя</div>

            <div class="form-group">
                <label>Тел. для перевода (СБП)</label>
                <input type="tel" id="phone" placeholder="+7 (999) 000-00-00">
            </div>

            <div class="form-group">
                <label>ФИО получателя</label>
                <input type="text" id="fullName" placeholder="Иванов Иван Иванович">
            </div>

            <div class="form-group">
                <label>Банк</label>
                <input type="text" id="bankName" placeholder="Сбербанк, Т-Банк и т.д.">
            </div>

            <div class="form-group">
                <label>Номер карты</label>
                <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000">
            </div>
        </div>

        <button class="btn-submit" id="sendBtn">Подать заявку</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Курс (можно меняться через код/БД)
        let EXCHANGE_RATE = 92.5; 

        document.getElementById('currentRate').innerText = `${EXCHANGE_RATE} ₽`;

        const usdtInput = document.getElementById('usdtInput');
        const rubResult = document.getElementById('rubResult');

        usdtInput.addEventListener('input', () => {
            const usdt = parseFloat(usdtInput.value) || 0;
            const rub = (usdt * EXCHANGE_RATE).toFixed(2);
            rubResult.innerText = `${rub} ₽`;
        });

        document.getElementById('sendBtn').addEventListener('click', () => {
            const usdt = usdtInput.value.trim();
            const phone = document.getElementById('phone').value.trim();
            const fullName = document.getElementById('fullName').value.trim();
            const bankName = document.getElementById('bankName').value.trim();
            const cardNumber = document.getElementById('cardNumber').value.trim();

            if (!usdt || !phone || !fullName || !bankName) {
                tg.showAlert('Пожалуйста, заполните обязательные поля!');
                return;
            }

            const data = {
                usdt: usdt,
                rub: (parseFloat(usdt) * EXCHANGE_RATE).toFixed(2),
                rate: EXCHANGE_RATE,
                phone: phone,
                fullName: fullName,
                bankName: bankName,
                cardNumber: cardNumber || "Не указана"
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
